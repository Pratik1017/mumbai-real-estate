stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - data/base-file/mumbai.csv
    - src/data/data_ingestion.py
    params:
    - data_ingestion.random_state
    - data_ingestion.test_size
    outs:
    - data/raw
  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw/X_test.csv
    - data/raw/X_train.csv
    - data/raw/y_test.csv
    - data/raw/y_train.csv
    - src/data/data_preprocessing.py
    outs:
    - data/interim/X_test_cleaned.csv
    - data/interim/X_train_cleaned.csv
  feature_engineering:
    cmd: ^
