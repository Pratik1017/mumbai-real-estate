stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - data/base-file/mumbai.csv
    - src/data/data_ingestion.py
    params:
    - data_ingestion.random_state
    - data_ingestion.test_size
    outs:
    - data/raw
  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw/X_test.csv
    - data/raw/X_train.csv
    - data/raw/y_test.csv
    - data/raw/y_train.csv
    - src/data/data_preprocessing.py
    outs:
    - data/interim/X_test_cleaned.csv
    - data/interim/X_train_cleaned.csv
  feature_engineering:
    cmd: python src/features/feature_engineering.py
    deps:
    - data/interim/X_test_cleaned.csv
    - data/interim/X_train_cleaned.csv
    - src/features/feature_engineering.py
    outs:
    - data/processed/X_test_cleaned_v2.csv
    - data/processed/X_train_cleaned_v2.csv
  baseline_model:
    cmd: python -m src.models.baseline_model
    deps:
    - data/processed/X_test_cleaned_v2.csv
    - data/processed/X_train_cleaned_v2.csv
    - data/raw/y_test.csv
    - data/raw/y_train.csv
    - src/models/baseline_model.py
    params:
    - baseline_model.learning_rate
    - baseline_model.max_depth
    - baseline_model.random_state
    - baseline_model.subsample
  multi_model_hp:
    cmd: python -m src.models.multi_model_hp
    deps:
    - data/processed/X_train_cleaned_v2.csv
    - data/raw/y_train.csv
    - src/models/multi_model_hp.py
    metrics:
    - best_params.json
  final_model:
    cmd: .py -d data/processed/X_train_cleaned_v2.csv -d 
      data/processed/X_test_cleaned_v2.csv -d data/raw/y_train.csv -d 
      data/raw/y_test.csv -p final_model.n_estimators -p final_model.max_depth 
      -p final_model.min_samples_split -p final_model.min_samples_leaf -p 
      final_model.max_features -o model.pkl python -m src.models.final_model
    deps:
    - src/models/final_model
